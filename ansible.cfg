[defaults]
collections_path = ~/.ansible/collections
host_key_checking = False

[galaxy]
# "automation_hub" must be listed first so certified/Red Hat collections
# (ansible.controller, ansible.hub, ansible.platform, ansible.eda) resolve
# against Automation Hub. "release_galaxy" is kept as a fallback for the
# community collections (infra.aap_configuration*) if they are ever removed
# from Automation Hub.
server_list = automation_hub, release_galaxy

[galaxy_server.automation_hub]
# Replace with your Automation Hub content URL, e.g.:
#   On-prem/Private Automation Hub: https://<hub-hostname>/api/galaxy/content/published/
#   Red Hat Cloud/Hosted Hub:       https://console.redhat.com/api/automation-hub/content/published/
url = https://console.redhat.com/api/automation-hub/content/published/
# Token is read from the ANSIBLE_GALAXY_SERVER_AUTOMATION_HUB_TOKEN env var at
# runtime -- do NOT hardcode a token here.
# Only required for the Red Hat Cloud/Hosted Hub (console.redhat.com), which
# exchanges the offline token for an access token via SSO. Leave commented
# out for an on-prem/Private Automation Hub.
auth_url = https://sso.redhat.com/auth/realms/redhat-external/protocol/openid-connect/token

[galaxy_server.release_galaxy]
url = https://galaxy.ansible.com/api/