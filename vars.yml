---
# Connection/authentication (from environment)
aap_username: "{{ lookup('env', 'CONTROLLER_USERNAME') }}"
aap_password: "{{ lookup('env', 'CONTROLLER_PASSWORD') }}"
aap_hostname: "{{ lookup('env', 'CONTROLLER_HOST') }}"
aap_validate_certs: "{{ lookup('env', 'CONTROLLER_VERIFY_SSL') | default('false', true) }}"
aap_oauthtoken: "{{ lookup('env', 'CONTROLLER_OAUTH_TOKEN') }}"

# Legacy controller_* aliases are kept in sync because some collection code
# paths still expect those names.
controller_host: "{{ aap_hostname }}"
controller_username: "{{ aap_username }}"
controller_password: "{{ aap_password }}"
controller_validate_certs: "{{ aap_validate_certs }}"
controller_oauthtoken: "{{ aap_oauthtoken }}"

# Export/import scope
export_organization: ""
organization_filter: "{{ export_organization }}"
output_path: "./exports/{{ export_organization | default('') }}"
organization: "{{ export_organization }}"
flatten_output: true

# Keep output deterministic and avoid endpoints known to 404 by default.
input_tag:
  - controller_credentials
  - controller_credential_types
  - controller_execution_environments
  - controller_groups
  - controller_hosts
  - controller_instance_groups
  - controller_inventories
  - controller_inventory_sources
  - controller_job_templates
  - controller_notification_templates
  - controller_organizations
  - controller_projects
  - controller_roles
  - controller_schedules
  - controller_settings
  - controller_teams
  - controller_users
  - controller_workflow_job_templates

controller_configuration_filetree_create_secure_logging: "false"
...
